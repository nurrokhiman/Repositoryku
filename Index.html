<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Informasi Supervisi Akademik Sekolah</title>
<style>
:root{--ink:#14365d;--ink2:#1f4f86;--bg:#f2f5f9;--card:#fff;--line:#d9e1ea;--tx:#1d2733;--mut:#5d6b7a;--acc:#e0a100;--ok:#1f8a5b;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:250px;background:var(--ink);color:#dbe6f3;padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:16px;margin:0 8px 14px;color:#fff;line-height:1.3}
nav h1 small{display:block;font-weight:400;color:#9fb6d0;font-size:12px;margin-top:2px}
nav a{display:block;padding:8px 10px;border-radius:6px;color:inherit;text-decoration:none;cursor:pointer;font-size:14px}
nav a:hover{background:#1d4574}
nav a.on{background:var(--acc);color:#1b2430;font-weight:600}
nav hr{border:0;border-top:1px solid #2c5384;margin:10px 4px}
main{flex:1;padding:22px;min-width:0}
h2{margin:0 0 4px;font-size:22px;color:var(--ink)}
.sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--tx);width:100%}
.bar input,.bar select{width:auto;min-width:200px}
button{font:inherit;padding:8px 14px;border:0;border-radius:6px;background:var(--ink2);color:#fff;cursor:pointer}
button:hover{background:var(--ink)}
button.g{background:#e6ecf3;color:var(--ink)}button.d{background:var(--bad)}button.s{padding:4px 9px;font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#eaf0f6;color:var(--ink);white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.SB{background:var(--ok)}.B{background:#2e86c1}.C{background:var(--acc);color:#222}.K{background:var(--bad)}
.meter{background:#e6ecf3;border-radius:4px;height:8px;min-width:90px}.meter i{display:block;height:8px;border-radius:4px;background:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat b{display:block;font-size:26px;color:var(--ink)}.stat span{color:var(--mut);font-size:13px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:9}
#modal.on{display:flex}
#modal form{background:#fff;border-radius:10px;padding:18px;width:100%;max-width:620px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:10}
.mode{font-size:12px;margin:12px 8px 0;color:#9fb6d0}
.me{margin:12px 8px 6px;font-size:14px;color:#fff}.me small{display:block;color:#9fb6d0;font-size:12px}
.lg{max-width:380px;margin:10vh auto;padding:0 16px;width:100%}.lg .card{padding:22px}.sec{margin:16px 0 6px;font-size:15px;color:var(--ink);border-bottom:2px solid var(--acc);padding-bottom:3px}nav select{width:100%;margin-top:4px;padding:6px 8px;font-size:13px}.err{color:var(--bad);font-size:13px;min-height:20px}
.lap h3{color:var(--ink);border-bottom:2px solid var(--acc);padding-bottom:3px;margin:18px 0 8px;font-size:16px}
@media(max-width:800px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}nav h1{width:100%}nav hr,.mode{display:none}main{padding:14px}}
@media print{nav,.bar,button,#toast{display:none!important}body{display:block;background:#fff}main{padding:0}.card{border:0;padding:0}}
</style>
</head>
<body>
<nav id="nav" style="display:none"></nav>
<main id="main"><p>Memuat data…</p></main>
<div id="modal"></div><div id="toast"></div>

<script>
const BUILD='v18-14nov2026';
const showErr=m=>{const e=document.querySelector('#main');if(e&&/Memuat/.test(e.innerHTML)){document.querySelector('#nav').style.display='none';e.innerHTML='<div class="card"><b>Aplikasi tidak dapat dimulai.</b><br>'+String(m).replace(/</g,'&lt;')+'<br><small>Build '+BUILD+'. Kirim pesan ini ke pengembang.</small></div>'}};
window.addEventListener('error',e=>showErr(e.message+' (baris '+e.lineno+')'));
window.addEventListener('unhandledrejection',e=>showErr((e.reason&&e.reason.message)||e.reason));
/* ---------- Definisi modul: [kunci, label, tipe, opsi] tipe: t=teks d=tanggal a=area g=guru s=skor 1-4 l=pilihan ---------- */
const SK=[['1','1 - Kurang'],['2','2 - Cukup'],['3','3 - Baik'],['4','4 - Sangat baik']];
const S=(k,l)=>[k,l,'s'];
const SA=[['1','1 - Tidak ada'],['2','2 - Ada, belum lengkap'],['3','3 - Lengkap'],['4','4 - Lengkap & berkualitas']];
const A=(k,l)=>[k,l,'s',SA],H=l=>['_h'+l[0],l,'h'];
const M={
 sekolah:{t:'Identitas Sekolah',d:'Data sekolah dan kepala sekolah. Terisi otomatis pada laporan dan program supervisi. Hanya admin yang dapat mengubah.',f:[['nama','Nama sekolah','t'],['npsn','NPSN','t'],['jenjang','Jenjang','l',['SD/MI','SMP/MTs','SMA/MA','SMK']],['alamat','Alamat','t'],['tahun','Tahun ajaran aktif','t'],['kepsek','Nama kepala sekolah','t'],['nipkepsek','NIP kepala sekolah','t']]},
 program:{t:'Perencanaan Program',d:'Rencana program supervisi akademik per tahun ajaran.',f:[['tahun','Tahun ajaran','t'],['semester','Semester','l',['Ganjil','Genap']],['tujuan','Tujuan supervisi','a'],['sasaran','Sasaran','a'],['teknik','Teknik supervisi','l',['Kunjungan kelas','Pemeriksaan dokumen','Supervisi kelompok','Kunjungan informal','Teman sejawat']],['waktu','Waktu pelaksanaan','t'],['pj','Penanggung jawab','t']]},
 guru:{t:'Data Guru & Tendik',d:'Pendataan guru dan tenaga pendidik.',f:[['nama','Nama lengkap','t'],['nip','NIP / NUPTK','t'],['jenjang','Jenjang','l',['SD','SMP','SMA','SMK']],['mapel','Mata pelajaran / tugas','t'],['kelas','Kelas diampu','t'],['status','Status','l',['PNS','PPPK','GTY','GTT/Honorer','Tendik']],['jabatan','Jabatan / golongan','t']]},
 jadwal:{t:'Jadwal Supervisi',d:'Penyusunan jadwal supervisi per guru.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],['jam','Jam / jam ke-','t'],['kelas','Kelas','t'],['jenis','Jenis supervisi','l',['Administrasi','Observasi kelas','Asesmen','Pembinaan']],['supervisor','Supervisor','t'],['status','Status','l',['Terjadwal','Selesai','Ditunda']]]},
 adm:{t:'Pemeriksaan Administrasi Guru Kelas',d:'Kelengkapan dan kualitas administrasi guru kelas. Skala: 1 tidak ada, 2 ada tetapi belum lengkap, 3 lengkap, 4 lengkap dan berkualitas.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],['kelas','Kelas','t'],
  H('A. Dokumen perencanaan pembelajaran'),A('kaldik','Kalender pendidikan & hari efektif belajar'),A('cp','Capaian pembelajaran (CP)'),A('atp','Tujuan pembelajaran & alur tujuan pembelajaran (ATP)'),A('prota','Program tahunan (Prota)'),A('promes','Program semester (Promes)'),A('modul','Modul ajar / RPP'),A('kktp','Kriteria ketercapaian tujuan pembelajaran (KKTP)'),A('jadwal','Jadwal pelajaran'),A('p5','Modul projek penguatan profil pelajar Pancasila (P5)'),A('bahan','Bahan ajar & media pembelajaran'),
  H('B. Administrasi kelas'),A('siswa','Daftar nama & data siswa'),A('hadir','Daftar hadir siswa & rekapitulasi'),A('jurnal','Jurnal / agenda mengajar'),A('piket','Jadwal piket, tata tertib & kesepakatan kelas'),A('denah','Denah tempat duduk & struktur organisasi kelas'),A('kasus','Catatan perkembangan & kasus siswa'),A('hubung','Buku penghubung / komunikasi orang tua'),A('inv','Inventaris kelas & sarana belajar'),
  H('C. Asesmen dan penilaian'),A('adiag','Asesmen diagnostik (kognitif & non-kognitif)'),A('asesmen','Rencana & instrumen asesmen (kisi-kisi, soal, rubrik)'),A('nilai','Daftar nilai'),A('anilai','Analisis hasil asesmen'),A('remed','Program remedial & pengayaan'),A('rapor','Laporan hasil belajar (rapor) & deskripsi capaian'),
  H('D. Pengembangan dan keprofesian'),A('lit','Program literasi & numerasi'),A('sikap','Penilaian sikap & profil pelajar Pancasila'),A('pkb','Portofolio & pengembangan keprofesian (PMM, pelatihan)'),
  ['catatan','Catatan','a']]},
 obs:{t:'Observasi Pembelajaran',d:'Instrumen observasi pelaksanaan pembelajaran di kelas.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],['kelas','Kelas / materi','t'],S('buka','Kegiatan pendahuluan & apersepsi'),S('materi','Penguasaan materi'),S('metode','Metode & model pembelajaran'),S('media','Pemanfaatan media/TIK'),S('interaksi','Interaksi & keterlibatan siswa'),S('kelola','Pengelolaan kelas'),S('proses','Penilaian proses'),S('tutup','Penutup & refleksi'),['catatan','Temuan observasi','a']]},
 kompetensi:{t:'Kompetensi Guru',d:'Penilaian kompetensi pedagogik dan profesional.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],S('p1','Pedagogik: memahami karakteristik peserta didik'),S('p2','Pedagogik: merancang pembelajaran'),S('p3','Pedagogik: melaksanakan pembelajaran'),S('p4','Pedagogik: memanfaatkan teknologi'),S('p5','Pedagogik: mengembangkan potensi siswa'),S('f1','Profesional: penguasaan materi & struktur keilmuan'),S('f2','Profesional: pengembangan keprofesian berkelanjutan'),S('f3','Profesional: refleksi & inovasi praktik'),['catatan','Catatan','a']]},
 asesmen:{t:'Evaluasi Asesmen',d:'Kualitas asesmen pembelajaran yang dilakukan guru.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],S('diag','Asesmen diagnostik'),S('form','Asesmen formatif'),S('sum','Asesmen sumatif'),S('instr','Kualitas instrumen & rubrik'),S('analisis','Analisis hasil asesmen'),S('tl','Remedial & pengayaan'),S('umpan','Umpan balik ke siswa'),['catatan','Catatan','a']]},
 refleksi:{t:'Refleksi',d:'Refleksi guru dan supervisor pasca supervisi.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],['kuat','Kekuatan pembelajaran','a'],['lemah','Hal yang perlu diperbaiki','a'],['rguru','Refleksi guru','a'],['rsup','Refleksi supervisor','a'],['supervisor','Supervisor','t']]},
 rekom:{t:'Rekomendasi Perbaikan',d:'Rekomendasi hasil analisis supervisi.',f:[['guru','Guru','g'],['aspek','Aspek','l',['Administrasi','Pelaksanaan pembelajaran','Pedagogik','Profesional','Asesmen']],['temuan','Temuan','a'],['rekom','Rekomendasi','a'],['prioritas','Prioritas','l',['Tinggi','Sedang','Rendah']]]},
 rtl:{t:'Rencana Tindak Lanjut',d:'Rencana tindak lanjut pembinaan guru.',f:[['guru','Guru','g'],['kegiatan','Kegiatan tindak lanjut','a'],['bentuk','Bentuk pembinaan','l',['Pendampingan','Workshop/PKG','KKG/MGMP','Pelatihan daring','Supervisi ulang']],['target','Target selesai','d'],['pj','Penanggung jawab','t']]},
 monev:{t:'Monev Tindak Lanjut',d:'Pemantauan dan evaluasi pelaksanaan tindak lanjut.',f:[['guru','Guru','g'],['tanggal','Tanggal monev','d'],['rtl','Kegiatan yang dipantau','t'],['progres','Progres (%)','l',['0','25','50','75','100']],['hasil','Hasil / dampak','a'],['status','Status','l',['Belum mulai','Berjalan','Selesai','Terkendala']]]},
 pengguna:{t:'Pengguna & Hak Akses',d:'Kelola akun. Admin: semua akses. Supervisor: kelola semua data supervisi. Guru: hanya melihat data sendiri dan mengisi refleksi.',f:[['username','Username','t'],['nama','Nama lengkap','t'],['peran','Peran','l',[['admin','Admin'],['supervisor','Supervisor / kepala sekolah'],['guru','Guru']]],['guru','Tautkan ke data guru (wajib untuk peran Guru)','g'],['sandi','Sandi (kosongkan jika tidak diubah)','p']]}
};
const KEYS=Object.keys(M).filter(k=>k!=='pengguna'),SC=['adm','obs','kompetensi','asesmen'];
const PERAN={admin:'Admin',supervisor:'Supervisor',guru:'Guru'};
const D={},$=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cols=k=>{const c=M[k].f.filter(x=>x[2]!=='h').map(x=>x[0]);return k!=='pengguna'&&c.includes('guru')?[...c,'gid']:c};
const sf=k=>M[k].f.filter(x=>x[2]==='s');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};

/* ---------- Tautan guru berbasis ID (data lama berbasis nama tetap terbaca bila namanya unik) ---------- */
const gOf=r=>{if(r.gid)return r.gid;const m=D.guru.filter(g=>g.nama.trim()===String(r.guru||'').trim());return m.length===1?m[0].id:''};
const gnm=id=>(D.guru.find(g=>g.id===id)||{}).nama||'';
const gDisp=(k,r)=>{if(k==='pengguna'){const g=D.guru.find(z=>z.id===r.guru||z.nama===r.guru);return g?g.nama:r.guru}return gnm(gOf(r))||r.guru||''};
/* ---------- Periode (tahun ajaran & semester) ---------- */
const taOf=d=>{const m=/^(\d{4})-(\d{2})/.exec(String(d||''));if(!m)return null;const y=+m[1];return +m[2]>=7?{ta:y+'/'+(y+1),sem:'Ganjil'}:{ta:(y-1)+'/'+y,sem:'Genap'}};
const PD={jadwal:'tanggal',adm:'tanggal',obs:'tanggal',kompetensi:'tanggal',asesmen:'tanggal',refleksi:'tanggal',monev:'tanggal'};
let PER=(()=>{try{const s=JSON.parse(sessionStorage.getItem('sisupak_per'));if(s)return s}catch(e){}const c=taOf(new Date().toISOString());return{ta:c.ta,sem:c.sem}})();
const savePer=()=>{try{sessionStorage.setItem('sisupak_per',JSON.stringify(PER))}catch(e){}};
const perLabel=()=>(PER.ta||'Semua tahun ajaran')+(PER.sem?' '+PER.sem:'');
function perOf(k,r){
 if(k==='program'){const m=/(\d{4})\D+(\d{4})/.exec(r.tahun||'');return m?{ta:m[1]+'/'+m[2],sem:r.semester||''}:null}
 return taOf((PD[k]&&r[PD[k]])||r.dibuat);
}
const inPer=(k,r)=>{if(k==='guru'||k==='sekolah')return true;const p=perOf(k,r);return !p||((!PER.ta||p.ta===PER.ta)&&(!PER.sem||!p.sem||p.sem===PER.sem))};
const P=k=>D[k].filter(r=>inPer(k,r));
function taOpts(){
 const set=new Set([taOf(new Date().toISOString()).ta,PER.ta].filter(Boolean));
 KEYS.forEach(k=>{if(k!=='guru'&&k!=='sekolah')(D[k]||[]).forEach(r=>{const p=perOf(k,r);if(p)set.add(p.ta)})});
 return '<option value="">Semua tahun ajaran</option>'+[...set].sort().reverse().map(t=>`<option${PER.ta===t?' selected':''}>${t}</option>`).join('');
}

/* ---------- Lapisan data: Google Sheets (Apps Script) atau mode demo (localStorage) ---------- */
const GAS=typeof google!=='undefined'&&google.script&&google.script.run;
let TOKEN='',ME=null;
const srv=(fn,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>{
 if(/SESI/.test(e.message||e)){TOKEN='';ME=null;try{sessionStorage.removeItem('sisupak_t')}catch(x){}authView(false,'Sesi berakhir. Silakan masuk lagi.')}no(e)})[fn](...a));
function call(act,k,row){
 return new Promise((ok,no)=>{
  if(GAS){const p=k==='pengguna'?(act==='list'?srv('userList',TOKEN):act==='save'?srv('userSave',TOKEN,row):srv('userDel',TOKEN,row)):srv('api',TOKEN,act,k,cols(k),row||{});return p.then(ok,no)}
  let a=[];try{a=JSON.parse(localStorage.getItem('sisupak_'+k)||'[]')}catch(e){}
  if(act==='save'){row.id=row.id||Math.random().toString(36).slice(2,10);row.dibuat=row.dibuat||new Date().toISOString();const i=a.findIndex(r=>r.id===row.id);i>-1?a[i]=row:a.push(row)}
  if(act==='del')a=a.filter(r=>r.id!==row.id);
  if(act==='bulk'){const ids=row.map(o=>{o.id=Math.random().toString(36).slice(2,10);o.dibuat=new Date().toISOString();a.push(o);return o.id});try{localStorage.setItem('sisupak_'+k,JSON.stringify(a))}catch(e){}return ok(ids)}
  try{localStorage.setItem('sisupak_'+k,JSON.stringify(a))}catch(e){}
  ok(act==='list'?a:true);
 });
}
async function load(){
 const ks=ME.peran==='admin'?[...KEYS,'pengguna']:KEYS;
 let r;
 if(GAS){const defs={};ks.forEach(k=>defs[k]=cols(k));const o=await srv('loadAll',TOKEN,defs);r=ks.map(k=>o[k]||[])}
 else r=await Promise.all(ks.map(k=>call('list',k)));
 ks.forEach((k,i)=>D[k]=r[i]);
}

/* ---------- Perhitungan ---------- */
const pct=(r,k)=>{const f=sf(k).map(x=>+r[x[0]]).filter(n=>n>0);return f.length?f.reduce((a,b)=>a+b,0)/(f.length*4)*100:null};
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const pred=p=>p==null?['-','']:p>=86?['Sangat baik','SB']:p>=71?['Baik','B']:p>=56?['Cukup','C']:['Kurang','K'];
const pill=p=>{const[t,c]=pred(p);return c?`<span class="pill ${c}">${t}</span>`:'-'};
const fmt=p=>p==null?'-':p.toFixed(1);
function nilaiGuru(id){
 const o={};SC.forEach(k=>o[k]=avg(P(k).filter(r=>gOf(r)===id).map(r=>pct(r,k))));
 o.total=avg(SC.map(k=>o[k]));
 let low=[];SC.forEach(k=>P(k).filter(r=>gOf(r)===id).forEach(r=>sf(k).forEach(x=>{if(+r[x[0]]>0&&+r[x[0]]<=2)low.push(x[1])})));
 o.low=[...new Set(low)];return o;
}

/* ---------- Navigasi ---------- */
let cur='dash',q='';
function nav(){
 $('#nav').style.display='';$('#nav').innerHTML=`<h1>Sistem Informasi Supervisi Akademik Sekolah<small>SD · SMP · SMA/SMK</small></h1>
 <div class="me" style="margin-top:0">Periode<select id="pta">${taOpts()}</select><select id="psm">${['','Ganjil','Genap'].map(v=>`<option value="${v}"${PER.sem===v?' selected':''}>${v||'Semua semester'}</option>`).join('')}</select></div><hr>
 <a data-v="dash">Analisis hasil supervisi</a><hr>`+KEYS.map(k=>`<a data-v="${k}">${M[k].t}</a>`).join('')+`<hr><a data-v="laporan">Laporan supervisi</a>`+(ME.peran==='admin'?`<a data-v="pengguna">${M.pengguna.t}</a>`:'')+`<hr><div class="me">${esc(ME.nama)}<small>${PERAN[ME.peran]}</small></div><a data-v="sandi">Ubah sandi</a><a data-v="keluar">Keluar</a>
 <div class="mode">${GAS?'Terhubung ke Google Sheets':'Mode demo (data di peramban)'} · ${BUILD}</div>`;
 document.querySelectorAll('nav a').forEach(a=>{a.classList.toggle('on',a.dataset.v===cur);a.onclick=()=>{const v=a.dataset.v;if(v==='keluar')return logout();if(v==='sandi')return pwForm();cur=v;q='';render()}});
 $('#pta').onchange=e=>{PER.ta=e.target.value;savePer();render()};$('#psm').onchange=e=>{PER.sem=e.target.value;savePer();render()};
}
function render(){nav();cur==='dash'?dash():cur==='laporan'?laporan():table(cur);scrollTo(0,0)}

/* ---------- Tabel CRUD ---------- */
function table(k){
 const m=M[k],canE=k==='sekolah'?ME.peran==='admin':(ME.peran!=='guru'||k==='refleksi'),canD=k==='sekolah'?ME.peran==='admin':ME.peran!=='guru',show=m.f.filter(x=>!'asph'.includes(x[2])).slice(0,5),isS=sf(k).length>0;
 const rows=P(k).filter(r=>JSON.stringify(Object.values(r)).toLowerCase().includes(q.toLowerCase()));
 $('#main').innerHTML=`<h2>${m.t}</h2><p class="sub">${m.d}${k==='guru'||k==='sekolah'?'':' · Periode: '+perLabel()}</p><div class="card">
 <div class="bar"><input id="q" placeholder="Cari…" value="${esc(q)}">${canE&&!(k==='sekolah'&&D.sekolah.length)?'<button id="add">Tambah data</button>':''}${k==='guru'&&canE?'<button class="g" id="imp">Impor dari Excel</button>':''}${k==='guru'&&ME.peran==='admin'?'<button class="g" id="mig">Tautkan data lama ke ID</button>':''}</div>

 const sh=a=>a.map(x=>{const l=x.l.includes(': ')?x.l.split(': ')[1]:x.l;return l[0].toLowerCase()+l.slice(1)+' (skor '+x.v+')'}).join('; ');
 const T={adm:['administrasi pembelajaran','Lengkapi dan perbarui dokumen yang masih kurang sebelum supervisi berikutnya.'],obs:['pelaksanaan pembelajaran','Lakukan pendampingan dan observasi ulang pada aspek yang masih lemah.'],kompetensi:['kompetensi guru','Ikuti pelatihan atau diskusi KKG/MGMP pada kompetensi yang masih rendah.'],asesmen:['asesmen pembelajaran','Perbaiki instrumen serta tindak lanjut hasil asesmen (remedial dan pengayaan).']}[k];
 f.catatan.value=`Secara umum ${T[0]} memperoleh skor ${p.toFixed(1)} dengan predikat ${pred(p)[0].toLowerCase()}. `+(hi.length?`Hal yang sudah baik: ${sh(hi)}. `:'')+(lo.length?`Hal yang perlu ditingkatkan: ${sh(lo)}. ${T[1]}`:'Tidak ditemukan aspek dengan skor rendah. Pertahankan dan kembangkan praktik yang sudah baik.')+(ok.length<it.length?` Terdapat ${it.length-ok.length} butir yang belum dinilai.`:'');
 toast('Catatan dibuat. Silakan sunting bila perlu.');
}
function genRef(){
 const f=$('#modal form'),nm=f.guru.value;
 if(!nm)return toast('Pilih guru terlebih dulu');
 const it=[];
 SC.forEach(k=>sf(k).forEach(x=>{const v=P(k).filter(r=>gOf(r)===nm).map(r=>+r[x[0]]).filter(n=>n>0);if(v.length)it.push({l:x[1],a:v.reduce((a,b)=>a+b,0)/v.length})}));
 if(!it.length)return toast('Belum ada hasil supervisi untuk guru ini');
 if(['kuat','lemah','rguru','rsup'].some(n=>f[n].value.trim())&&!confirm('Isi kolom refleksi yang ada akan diganti. Lanjutkan?'))return;
 const hi=[...it].sort((a,b)=>b.a-a.a).filter(x=>x.a>=3).slice(0,4),lo=[...it].sort((a,b)=>a.a-b.a).filter(x=>x.a<3).slice(0,4);
 const ln=a=>a.map(x=>`- ${x.l} (skor ${x.a.toFixed(1)} dari 4)`).join('\n');
 const sh=a=>a.slice(0,3).map(x=>{const l=x.l.includes(': ')?x.l.split(': ')[1]:x.l;return l[0].toLowerCase()+l.slice(1)}).join(', ');
 const n=nilaiGuru(nm),pt=pred(n.total)[0].toLowerCase();
 f.kuat.value=hi.length?ln(hi):'Belum ada indikator dengan skor baik (3 ke atas). Penguatan perlu dimulai dari dasar pembelajaran.';
 f.lemah.value=lo.length?ln(lo):'Tidak ditemukan indikator dengan skor di bawah 3.';
 f.rguru.value=`Setelah mengikuti supervisi, saya menyadari bahwa ${hi.length?'pembelajaran saya sudah baik pada '+sh(hi)+'.':'saya masih perlu memperkuat banyak aspek pembelajaran.'} ${lo.length?'Saya perlu meningkatkan '+sh(lo)+'. Saya akan menerapkan masukan supervisor, berdiskusi dengan rekan sejawat, dan mencoba perbaikan pada pembelajaran berikutnya.':'Saya akan mempertahankan kualitas ini dan terus berinovasi dalam pembelajaran.'}`;
 if(ME.peran!=='guru')f.rsup.value=`Hasil supervisi menunjukkan skor akhir ${fmt(n.total)} dengan predikat ${pt}. ${hi.length?'Guru menunjukkan kekuatan pada '+sh(hi)+'. ':''}${lo.length?'Aspek yang perlu dibina: '+sh(lo)+'. Disarankan pendampingan, pelatihan terkait, dan supervisi ulang untuk memantau perbaikan.':'Guru dapat menjadi rekan berbagi praktik baik bagi guru lain.'}`;
 toast('Draf refleksi dibuat. Silakan sunting bila perlu.');
}
/* ---------- Impor guru dari Excel/CSV ---------- */
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';e.onload=ok;e.onerror=()=>no(new Error('Pustaka Excel gagal dimuat. Simpan file sebagai CSV, atau tempel datanya.'));document.head.appendChild(e)})}
function parseDel(t){
 t=t.replace(/^\uFEFF/,'');const l1=t.split(/\r?\n/)[0],d=l1.includes('\t')?'\t':(l1.split(';').length>l1.split(',').length?';':',');
 const out=[];let row=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;
  else if(ch===d){row.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);out.push(row);row=[];c=''}
  else c+=ch}
 if(c||row.length){row.push(c);out.push(row)}
 return out;
}
async function readSrc(){
 const fl=$('#fl').files[0];
 if(fl){
  if(/\.csv$/i.test(fl.name))return parseDel(await fl.text());
  await loadXLSX();const wb=XLSX.read(await fl.arrayBuffer(),{type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
 }
 const t=$('#pt').value;if(!t.trim())throw new Error('Pilih file atau tempel data terlebih dulu.');return parseDel(t);
}
function buildImp(A){
 const hk=(A[0]||[]).map(h=>{h=String(h).toLowerCase();return /^nama/.test(h)?'nama':/nip|nuptk/.test(h)?'nip':/jenjang/.test(h)?'jenjang':/mapel|mata pelajaran|tugas/.test(h)?'mapel':/kelas/.test(h)?'kelas':/status/.test(h)?'status':/jabatan|golongan/.test(h)?'jabatan':''});
 if(!hk.includes('nama'))throw new Error('Kolom "Nama" tidak ditemukan pada baris pertama.');
 const fo=n=>M.guru.f.find(x=>x[0]===n)[3],nm=(v,a)=>a.find(o=>o.toLowerCase()===v.toLowerCase())||v;
 const ni=new Set(D.guru.filter(g=>g.nip).map(g=>g.nip.trim())),nA=new Set(D.guru.map(g=>g.nama.trim().toLowerCase())),n0=new Set(D.guru.filter(g=>!g.nip).map(g=>g.nama.trim().toLowerCase()));
 const ok=[];let dup=0,kosong=0;
 A.slice(1).forEach(r=>{
  if(!r.some(c=>String(c).trim()))return;
  const o={};hk.forEach((k,i)=>{if(k&&!o[k])o[k]=String(r[i]??'').trim()});
  if(!o.nama){kosong++;return}
  if(o.jenjang)o.jenjang=nm(o.jenjang,fo('jenjang'));if(o.status)o.status=nm(o.status,fo('status'));
  const ln=o.nama.toLowerCase();
  if(o.nip?(ni.has(o.nip)||n0.has(ln)):nA.has(ln)){dup++;return}
  if(o.nip)ni.add(o.nip);else n0.add(ln);nA.add(ln);ok.push(o)});
 return{ok,dup,kosong};
}
function impGuru(){
 $('#modal').innerHTML=`<form><h2>Impor Data Guru dari Excel</h2>
 <p class="sub">Kolom yang dikenali: Nama (wajib), NIP/NUPTK, Jenjang, Mapel/Tugas, Kelas, Status, Jabatan. Baris pertama berisi judul kolom. Guru yang NIP-nya sudah terdaftar dilewati (jika tanpa NIP, dicocokkan dengan nama). Dua guru bernama sama dengan NIP berbeda boleh diimpor.</p>
 <div class="f"><label>Pilih file (.xlsx, .xls, .csv)</label><input type="file" id="fl" accept=".xlsx,.xls,.csv"></div>
 <div class="f"><label>Atau tempel data dari Excel (termasuk baris judul)</label><textarea id="pt" rows="4"></textarea><button type="button" class="g s" id="ex" style="margin-top:6px">Tampilkan contoh format</button></div>
 <div class="bar"><button type="button" id="pv">Pratinjau</button><button type="button" class="g" id="cx">Tutup</button></div><div id="pvo"></div></form>`;
 $('#modal').classList.add('on');$('#cx').onclick=()=>$('#modal').classList.remove('on');
 $('#ex').onclick=()=>{$('#pt').value='Nama\tNIP/NUPTK\tJenjang\tMapel/Tugas\tKelas\tStatus\tJabatan\nSiti Aminah, S.Pd\t198501012010012001\tSD\tGuru Kelas\t4A\tPNS\tGuru Ahli Pertama\nBudi Santoso, S.Pd\t\tSMP\tMatematika\t7-9\tGTY\t'};
 $('#pv').onclick=async()=>{
  const o=$('#pvo');o.innerHTML='Membaca data…';
  try{
   const R=buildImp(await readSrc());
   if(!R.ok.length){o.innerHTML=`<p class="err">Tidak ada guru baru untuk diimpor. Dilewati: ${R.dup} sudah terdaftar, ${R.kosong} tanpa nama.</p>`;return}
   o.innerHTML=`<p><b>${R.ok.length} guru siap diimpor.</b> Dilewati: ${R.dup} sudah terdaftar, ${R.kosong} tanpa nama.</p><div class="tw"><table><thead><tr><th>Nama</th><th>NIP</th><th>Jenjang</th><th>Mapel</th><th>Status</th></tr></thead><tbody>${R.ok.slice(0,8).map(g=>`<tr><td>${esc(g.nama)}</td><td>${esc(g.nip)}</td><td>${esc(g.jenjang)}</td><td>${esc(g.mapel)}</td><td>${esc(g.status)}</td></tr>`).join('')}</tbody></table></div>${R.ok.length>8?`<p class="sub">…dan ${R.ok.length-8} lainnya.</p>`:''}<div class="bar"><button type="button" id="go">Impor ${R.ok.length} guru</button></div>`;
   $('#go').onclick=async e=>{e.target.disabled=true;e.target.textContent='Mengimpor…';
    try{const ids=await call('bulk','guru',R.ok);R.ok.forEach((g,i)=>D.guru.push({...g,id:ids[i]||Math.random().toString(36).slice(2,10),dibuat:new Date().toISOString()}));
     $('#modal').classList.remove('on');toast(R.ok.length+' guru berhasil diimpor');table('guru')}
    catch(er){e.target.disabled=false;e.target.textContent='Coba lagi';alert('Gagal mengimpor: '+msgOf(er))}};
  }catch(er){o.innerHTML=`<p class="err">${esc(msgOf(er))}</p>`}
 };
}
