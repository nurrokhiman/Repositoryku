<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Informasi Supervisi Akademik Sekolah</title>
<style>
:root{--ink:#14365d;--ink2:#1f4f86;--bg:#f2f5f9;--card:#fff;--line:#d9e1ea;--tx:#1d2733;--mut:#5d6b7a;--acc:#e0a100;--ok:#1f8a5b;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:250px;background:var(--ink);color:#dbe6f3;padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:16px;margin:0 8px 14px;color:#fff;line-height:1.3}
nav h1 small{display:block;font-weight:400;color:#9fb6d0;font-size:12px;margin-top:2px}
nav a{display:block;padding:8px 10px;border-radius:6px;color:inherit;text-decoration:none;cursor:pointer;font-size:14px}
nav a:hover{background:#1d4574}
nav a.on{background:var(--acc);color:#1b2430;font-weight:600}
nav hr{border:0;border-top:1px solid #2c5384;margin:10px 4px}
main{flex:1;padding:22px;min-width:0}
h2{margin:0 0 4px;font-size:22px;color:var(--ink)}
.sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--tx);width:100%}
.bar input,.bar select{width:auto;min-width:200px}
button{font:inherit;padding:8px 14px;border:0;border-radius:6px;background:var(--ink2);color:#fff;cursor:pointer}
button:hover{background:var(--ink)}
button.g{background:#e6ecf3;color:var(--ink)}button.d{background:var(--bad)}button.s{padding:4px 9px;font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#eaf0f6;color:var(--ink);white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.SB{background:var(--ok)}.B{background:#2e86c1}.C{background:var(--acc);color:#222}.K{background:var(--bad)}
.meter{background:#e6ecf3;border-radius:4px;height:8px;min-width:90px}.meter i{display:block;height:8px;border-radius:4px;background:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat b{display:block;font-size:26px;color:var(--ink)}.stat span{color:var(--mut);font-size:13px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:9}
#modal.on{display:flex}
#modal form{background:#fff;border-radius:10px;padding:18px;width:100%;max-width:620px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:10}
.mode{font-size:12px;margin:12px 8px 0;color:#9fb6d0}
.lap h3{color:var(--ink);border-bottom:2px solid var(--acc);padding-bottom:3px;margin:18px 0 8px;font-size:16px}
@media(max-width:800px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}nav h1{width:100%}nav hr,.mode{display:none}main{padding:14px}}
@media print{nav,.bar,button,#toast{display:none!important}body{display:block;background:#fff}main{padding:0}.card{border:0;padding:0}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"><p>Memuat data…</p></main>
<div id="modal"></div><div id="toast"></div>

<script>
/* ---------- Definisi modul: [kunci, label, tipe, opsi] tipe: t=teks d=tanggal a=area g=guru s=skor 1-4 l=pilihan ---------- */
const SK=[['1','1 - Kurang'],['2','2 - Cukup'],['3','3 - Baik'],['4','4 - Sangat baik']];
const S=(k,l)=>[k,l,'s'];
const M={
 program:{t:'Perencanaan Program',d:'Rencana program supervisi akademik per tahun ajaran.',f:[['tahun','Tahun ajaran','t'],['semester','Semester','l',['Ganjil','Genap']],['tujuan','Tujuan supervisi','a'],['sasaran','Sasaran','a'],['teknik','Teknik supervisi','l',['Kunjungan kelas','Pemeriksaan dokumen','Supervisi kelompok','Kunjungan informal','Teman sejawat']],['waktu','Waktu pelaksanaan','t'],['pj','Penanggung jawab','t']]},
 guru:{t:'Data Guru & Tendik',d:'Pendataan guru dan tenaga pendidik.',f:[['nama','Nama lengkap','t'],['nip','NIP / NUPTK','t'],['jenjang','Jenjang','l',['SD','SMP','SMA','SMK']],['mapel','Mata pelajaran / tugas','t'],['kelas','Kelas diampu','t'],['status','Status','l',['PNS','PPPK','GTY','GTT/Honorer','Tendik']],['jabatan','Jabatan / golongan','t']]},
 jadwal:{t:'Jadwal Supervisi',d:'Penyusunan jadwal supervisi per guru.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],['jam','Jam / jam ke-','t'],['kelas','Kelas','t'],['jenis','Jenis supervisi','l',['Administrasi','Observasi kelas','Asesmen','Pembinaan']],['supervisor','Supervisor','t'],['status','Status','l',['Terjadwal','Selesai','Ditunda']]]},
 adm:{t:'Pemeriksaan Administrasi',d:'Kelengkapan dan kualitas perangkat pembelajaran.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],S('cp','Capaian/Tujuan pembelajaran & ATP'),S('prota','Prota & Promes'),S('modul','Modul ajar / RPP'),S('bahan','Bahan ajar & media'),S('asesmen','Rencana asesmen & KKTP'),S('nilai','Daftar nilai & analisis'),S('jurnal','Jurnal & daftar hadir'),['catatan','Catatan','a']]},
 obs:{t:'Observasi Pembelajaran',d:'Instrumen observasi pelaksanaan pembelajaran di kelas.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],['kelas','Kelas / materi','t'],S('buka','Kegiatan pendahuluan & apersepsi'),S('materi','Penguasaan materi'),S('metode','Metode & model pembelajaran'),S('media','Pemanfaatan media/TIK'),S('interaksi','Interaksi & keterlibatan siswa'),S('kelola','Pengelolaan kelas'),S('proses','Penilaian proses'),S('tutup','Penutup & refleksi'),['catatan','Temuan observasi','a']]},
 kompetensi:{t:'Kompetensi Guru',d:'Penilaian kompetensi pedagogik dan profesional.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],S('p1','Pedagogik: memahami karakteristik peserta didik'),S('p2','Pedagogik: merancang pembelajaran'),S('p3','Pedagogik: melaksanakan pembelajaran'),S('p4','Pedagogik: memanfaatkan teknologi'),S('p5','Pedagogik: mengembangkan potensi siswa'),S('f1','Profesional: penguasaan materi & struktur keilmuan'),S('f2','Profesional: pengembangan keprofesian berkelanjutan'),S('f3','Profesional: refleksi & inovasi praktik'),['catatan','Catatan','a']]},
 asesmen:{t:'Evaluasi Asesmen',d:'Kualitas asesmen pembelajaran yang dilakukan guru.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],S('diag','Asesmen diagnostik'),S('form','Asesmen formatif'),S('sum','Asesmen sumatif'),S('instr','Kualitas instrumen & rubrik'),S('analisis','Analisis hasil asesmen'),S('tl','Remedial & pengayaan'),S('umpan','Umpan balik ke siswa'),['catatan','Catatan','a']]},
 refleksi:{t:'Refleksi',d:'Refleksi guru dan supervisor pasca supervisi.',f:[['guru','Guru','g'],['tanggal','Tanggal','d'],['kuat','Kekuatan pembelajaran','a'],['lemah','Hal yang perlu diperbaiki','a'],['rguru','Refleksi guru','a'],['rsup','Refleksi supervisor','a'],['supervisor','Supervisor','t']]},
 rekom:{t:'Rekomendasi Perbaikan',d:'Rekomendasi hasil analisis supervisi.',f:[['guru','Guru','g'],['aspek','Aspek','l',['Administrasi','Pelaksanaan pembelajaran','Pedagogik','Profesional','Asesmen']],['temuan','Temuan','a'],['rekom','Rekomendasi','a'],['prioritas','Prioritas','l',['Tinggi','Sedang','Rendah']]]},
 rtl:{t:'Rencana Tindak Lanjut',d:'Rencana tindak lanjut pembinaan guru.',f:[['guru','Guru','g'],['kegiatan','Kegiatan tindak lanjut','a'],['bentuk','Bentuk pembinaan','l',['Pendampingan','Workshop/PKG','KKG/MGMP','Pelatihan daring','Supervisi ulang']],['target','Target selesai','d'],['pj','Penanggung jawab','t']]},
 monev:{t:'Monev Tindak Lanjut',d:'Pemantauan dan evaluasi pelaksanaan tindak lanjut.',f:[['guru','Guru','g'],['tanggal','Tanggal monev','d'],['rtl','Kegiatan yang dipantau','t'],['progres','Progres (%)','l',['0','25','50','75','100']],['hasil','Hasil / dampak','a'],['status','Status','l',['Belum mulai','Berjalan','Selesai','Terkendala']]]}
};
const KEYS=Object.keys(M),SC=['adm','obs','kompetensi','asesmen'];
const D={},$=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cols=k=>M[k].f.map(x=>x[0]);
const sf=k=>M[k].f.filter(x=>x[2]==='s');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};

/* ---------- Lapisan data: Google Sheets (Apps Script) atau mode demo (localStorage) ---------- */
const GAS=typeof google!=='undefined'&&google.script&&google.script.run;
function call(act,k,row){
 return new Promise((ok,no)=>{
  if(GAS)return google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e)).api(act,k,cols(k),row||{});
  let a=[];try{a=JSON.parse(localStorage.getItem('sisupak_'+k)||'[]')}catch(e){}
  if(act==='save'){row.id=row.id||Math.random().toString(36).slice(2,10);const i=a.findIndex(r=>r.id===row.id);i>-1?a[i]=row:a.push(row)}
  if(act==='del')a=a.filter(r=>r.id!==row.id);
  try{localStorage.setItem('sisupak_'+k,JSON.stringify(a))}catch(e){}
  ok(act==='list'?a:true);
 });
}
async function load(){
 const r=await Promise.all(KEYS.map(k=>call('list',k)));
 KEYS.forEach((k,i)=>D[k]=r[i]);
}

/* ---------- Perhitungan ---------- */
const pct=(r,k)=>{const f=sf(k).map(x=>+r[x[0]]).filter(n=>n>0);return f.length?f.reduce((a,b)=>a+b,0)/(f.length*4)*100:null};
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const pred=p=>p==null?['-','']:p>=86?['Sangat baik','SB']:p>=71?['Baik','B']:p>=56?['Cukup','C']:['Kurang','K'];
const pill=p=>{const[t,c]=pred(p);return c?`<span class="pill ${c}">${t}</span>`:'-'};
const fmt=p=>p==null?'-':p.toFixed(1);
function nilaiGuru(nama){
 const o={};SC.forEach(k=>o[k]=avg(D[k].filter(r=>r.guru===nama).map(r=>pct(r,k))));
 o.total=avg(SC.map(k=>o[k]));
 let low=[];SC.forEach(k=>D[k].filter(r=>r.guru===nama).forEach(r=>sf(k).forEach(x=>{if(+r[x[0]]>0&&+r[x[0]]<=2)low.push(x[1])})));
 o.low=[...new Set(low)];return o;
}

/* ---------- Navigasi ---------- */
let cur='dash',q='';
function nav(){
 $('#nav').innerHTML=`<h1>Sistem Informasi Supervisi Akademik Sekolah<small>SD · SMP · SMA/SMK</small></h1>
 <a data-v="dash">Analisis hasil supervisi</a><hr>`+KEYS.map(k=>`<a data-v="${k}">${M[k].t}</a>`).join('')+`<hr><a data-v="laporan">Laporan supervisi</a>
 <div class="mode">${GAS?'Terhubung ke Google Sheets':'Mode demo (data di peramban)'}</div>`;
 document.querySelectorAll('nav a').forEach(a=>{a.classList.toggle('on',a.dataset.v===cur);a.onclick=()=>{cur=a.dataset.v;q='';render()}});
}
function render(){nav();cur==='dash'?dash():cur==='laporan'?laporan():table(cur);scrollTo(0,0)}

/* ---------- Tabel CRUD ---------- */
function table(k){
 const m=M[k],show=m.f.filter(x=>x[2]!=='a'&&x[2]!=='s').slice(0,5),isS=sf(k).length>0;
 const rows=D[k].filter(r=>JSON.stringify(Object.values(r)).toLowerCase().includes(q.toLowerCase()));
 $('#main').innerHTML=`<h2>${m.t}</h2><p class="sub">${m.d}</p><div class="card">
 <div class="bar"><input id="q" placeholder="Cari…" value="${esc(q)}"><button id="add">Tambah data</button></div>
 <div class="tw"><table><thead><tr>${show.map(x=>`<th>${x[1]}</th>`).join('')}${isS?'<th>Skor</th><th>Predikat</th>':''}<th></th></tr></thead><tbody>
 ${rows.map(r=>`<tr>${show.map(x=>`<td>${esc(r[x[0]])}</td>`).join('')}${isS?`<td>${fmt(pct(r,k))}</td><td>${pill(pct(r,k))}</td>`:''}<td style="white-space:nowrap"><button class="s g" data-e="${r.id}">Ubah</button> <button class="s d" data-x="${r.id}">Hapus</button></td></tr>`).join('')||`<tr><td colspan="9">Belum ada data. Klik “Tambah data” untuk memulai.</td></tr>`}
 </tbody></table></div></div>`;
 $('#q').oninput=e=>{q=e.target.value;table(k);const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)};
 $('#add').onclick=()=>form(k);
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(k,D[k].find(r=>r.id===b.dataset.e)));
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus data ini?'))return;await call('del',k,{id:b.dataset.x});D[k]=D[k].filter(r=>r.id!==b.dataset.x);toast('Data dihapus');table(k)});
}
function form(k,r={}){
 const opt=(a,v,s)=>a.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}"${val===v?' selected':''}>${esc(lab)}</option>`}).join('');
 const inp=x=>{const[n,l,t,o]=x,v=r[n]||'';
  return t==='a'?`<textarea name="${n}" rows="3">${esc(v)}</textarea>`
   :t==='d'?`<input type="date" name="${n}" value="${esc(v)}">`
   :t==='l'?`<select name="${n}"><option value="">- pilih -</option>${opt(o,v)}</select>`
   :t==='g'?`<select name="${n}" required><option value="">- pilih guru -</option>${opt(D.guru.map(g=>g.nama),v)}</select>`
   :t==='s'?`<select name="${n}"><option value="">- belum dinilai -</option>${opt(SK,v)}</select>`
   :`<input name="${n}" value="${esc(v)}">`};
 $('#modal').innerHTML=`<form><h2>${r.id?'Ubah':'Tambah'} - ${M[k].t}</h2>${M[k].f.map(x=>`<div class="f"><label>${x[1]}</label>${inp(x)}</div>`).join('')}
 <div class="bar"><button>Simpan</button><button type="button" class="g" id="cx">Batal</button></div></form>`;
 $('#modal').classList.add('on');$('#cx').onclick=()=>$('#modal').classList.remove('on');
 if(k!=='guru'&&!D.guru.length&&M[k].f.some(x=>x[2]==='g'))toast('Isi Data Guru terlebih dulu');
 $('#modal form').onsubmit=async e=>{e.preventDefault();
  const row={id:r.id};new FormData(e.target).forEach((v,n)=>row[n]=v);
  try{const id=await call('save',k,row);row.id=row.id||id;const i=D[k].findIndex(z=>z.id===row.id);i>-1?D[k][i]=row:D[k].push(row);
   $('#modal').classList.remove('on');toast('Data tersimpan');table(k)}catch(er){alert('Gagal menyimpan: '+(er.message||er))}};
}

/* ---------- Analisis hasil supervisi ---------- */
function dash(){
 const G=D.guru.map(g=>({g,n:nilaiGuru(g.nama)}));
 const done=G.filter(x=>x.n.total!=null),cnt={SB:0,B:0,C:0,K:0};done.forEach(x=>cnt[pred(x.n.total)[1]]++);
 const rtlSel=D.monev.filter(m=>m.status==='Selesai').length;
 $('#main').innerHTML=`<h2>Analisis Hasil Supervisi</h2><p class="sub">Skor dihitung otomatis dari instrumen (skala 1-4 dikonversi ke 0-100). Predikat: ≥86 sangat baik, 71-85 baik, 56-70 cukup, &lt;56 kurang.</p>
 <div class="grid">${[['Guru & tendik',D.guru.length],['Sudah disupervisi',done.length],['Rata-rata skor',fmt(avg(done.map(x=>x.n.total)))],['Perlu pembinaan (cukup/kurang)',cnt.C+cnt.K],['Tindak lanjut selesai',D.monev.length?rtlSel+' / '+D.monev.length:'-']].map(s=>`<div class="card stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div>
 <div class="card"><div class="tw"><table><thead><tr><th>Guru</th><th>Administrasi</th><th>Observasi</th><th>Kompetensi</th><th>Asesmen</th><th>Skor akhir</th><th>Predikat</th><th>Aspek perlu diperbaiki</th></tr></thead><tbody>
 ${G.map(({g,n})=>`<tr><td><b>${esc(g.nama)}</b><br><small>${esc(g.mapel)} ${esc(g.jenjang)}</small></td>${SC.map(k=>`<td>${fmt(n[k])}</td>`).join('')}<td><div class="meter"><i style="width:${n.total||0}%"></i></div>${fmt(n.total)}</td><td>${pill(n.total)}</td><td><small>${n.low.slice(0,3).map(esc).join('; ')||'-'}</small></td></tr>`).join('')||'<tr><td colspan="8">Belum ada data guru.</td></tr>'}
 </tbody></table></div></div>`;
}

/* ---------- Laporan otomatis ---------- */
function laporan(){
 $('#main').innerHTML=`<h2>Laporan Supervisi</h2><p class="sub">Laporan dibuat otomatis dari seluruh data guru yang dipilih.</p>
 <div class="card"><div class="bar"><select id="lg"><option value="">- pilih guru -</option>${D.guru.map(g=>`<option>${esc(g.nama)}</option>`).join('')}</select>
 <input id="lsk" placeholder="Nama sekolah"><input id="lkp" placeholder="Nama kepala sekolah / supervisor"><button id="lp">Cetak / simpan PDF</button></div><div id="lo" class="lap"></div></div>`;
 const draw=()=>{const nm=$('#lg').value;if(!nm){$('#lo').innerHTML='';return}
  const g=D.guru.find(x=>x.nama===nm),n=nilaiGuru(nm),by=k=>D[k].filter(r=>r.guru===nm);
  const T=(k,fs)=>by(k).map(r=>`<tr>${fs.map(f=>`<td>${esc(r[f])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="9">Belum ada data.</td></tr>`;
  const[pt]=pred(n.total);
  const nar=n.total==null?'Belum ada hasil penilaian untuk guru ini.':`Berdasarkan hasil supervisi akademik, ${nm} memperoleh skor akhir ${fmt(n.total)} dengan predikat ${pt.toLowerCase()}. Skor per aspek: administrasi ${fmt(n.adm)}, observasi pembelajaran ${fmt(n.obs)}, kompetensi ${fmt(n.kompetensi)}, dan asesmen ${fmt(n.asesmen)}.`+(n.low.length?` Aspek yang masih perlu ditingkatkan: ${n.low.slice(0,5).join('; ').toLowerCase()}.`:' Tidak ditemukan aspek dengan skor rendah.');
  $('#lo').innerHTML=`<div style="text-align:center"><h2>LAPORAN SUPERVISI AKADEMIK</h2><b>${esc($('#lsk').value)||'Nama Sekolah'}</b></div>
  <h3>A. Identitas guru</h3><table><tr><td>Nama</td><td>${esc(g.nama)}</td><td>NIP/NUPTK</td><td>${esc(g.nip)}</td></tr><tr><td>Mapel/tugas</td><td>${esc(g.mapel)}</td><td>Jenjang / kelas</td><td>${esc(g.jenjang)} / ${esc(g.kelas)}</td></tr></table>
  <h3>B. Ringkasan hasil</h3><table><tr><th>Administrasi</th><th>Observasi</th><th>Kompetensi</th><th>Asesmen</th><th>Skor akhir</th><th>Predikat</th></tr><tr><td>${fmt(n.adm)}</td><td>${fmt(n.obs)}</td><td>${fmt(n.kompetensi)}</td><td>${fmt(n.asesmen)}</td><td><b>${fmt(n.total)}</b></td><td>${pt}</td></tr></table><p>${nar}</p>
  <h3>C. Jadwal supervisi</h3><table><tr><th>Tanggal</th><th>Jenis</th><th>Kelas</th><th>Status</th></tr>${T('jadwal',['tanggal','jenis','kelas','status'])}</table>
  <h3>D. Refleksi</h3><table><tr><th>Tanggal</th><th>Kekuatan</th><th>Perlu diperbaiki</th><th>Refleksi guru</th><th>Refleksi supervisor</th></tr>${T('refleksi',['tanggal','kuat','lemah','rguru','rsup'])}</table>
  <h3>E. Rekomendasi perbaikan</h3><table><tr><th>Aspek</th><th>Temuan</th><th>Rekomendasi</th><th>Prioritas</th></tr>${T('rekom',['aspek','temuan','rekom','prioritas'])}</table>
  <h3>F. Rencana tindak lanjut</h3><table><tr><th>Kegiatan</th><th>Bentuk</th><th>Target</th><th>Penanggung jawab</th></tr>${T('rtl',['kegiatan','bentuk','target','pj'])}</table>
  <h3>G. Monitoring & evaluasi</h3><table><tr><th>Tanggal</th><th>Kegiatan</th><th>Progres %</th><th>Hasil</th><th>Status</th></tr>${T('monev',['tanggal','rtl','progres','hasil','status'])}</table>
  <table style="margin-top:30px;border:0"><tr><td style="border:0">Guru yang disupervisi<br><br><br><br>${esc(g.nama)}</td><td style="border:0;text-align:right">Supervisor<br><br><br><br>${esc($('#lkp').value)||'.....................'}</td></tr></table>`};
